name: Build and Deploy Website to Live Server

on:
  push:
    branches:
      - arun1324
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production app
        run: npm run build
        env:
          NG_CLI_ANALYTICS: "false"
          CI: "true"

      - name: Deploy production build to Hostinger Live Server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" "${FTP_SERVER}" <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 3
          mirror --reverse --verbose --parallel=3 dist/avirbhav-web/browser/ ${FTP_SERVER_DIR:-/}
          bye
          EOF
